[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-injection-evals"
version = "1.0.0"
description = "Inspect (UK AISI) implementation of InjecAgent: benchmarking indirect prompt injection against tool-using LLM agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Adam Goldfine" }]
keywords = ["inspect-ai", "evals", "prompt-injection", "ai-safety", "ai-security", "agents", "injecagent"]
dependencies = ["inspect_ai>=0.3.150"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23"]
openai = ["openai"]
anthropic = ["anthropic"]

[project.entry-points.inspect_ai]
injecagent = "injecagent._registry"

[project.urls]
Homepage = "https://github.com/tulaneadam/agent-injection-evals"
Paper = "https://arxiv.org/abs/2403.02691"
Upstream = "https://github.com/uiuc-kang-lab/InjecAgent"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: downloads the pinned InjecAgent data from GitHub"]
